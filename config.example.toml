# tuichk configuration — copy to ~/.config/tuichk/config.toml

# Base URL of your CheckMK site, including the site name.
url = "https://monitoring.example.com/mysite"

# CheckMK user to authenticate as (an automation user works well).
username = "automation"

# Command whose stdout is the password — keeps secrets out of this file.
password_cmd = "pass show checkmk/automation"

# Alternatively, set the password directly (password_cmd wins if both set):
# password = "..."

# Auto-refresh interval in seconds. 0 disables auto-refresh. Default: 120.
# Only the cheap problems query runs on this interval; the full service
# list is fetched at most once per session (r in the Services view refetches).
# refresh_seconds = 120

# Skip TLS certificate verification (self-signed certs).
# insecure_tls = false

# Capture the mouse at startup: wheel scrolls, click selects a row, a
# second click opens it, clicking a tab switches view. Off by default
# because it takes over the terminal's own text selection (use shift-drag
# or alt-drag to copy while it is on). :mouse toggles it at runtime.
# mouse = false

# The "hot window": crit-level problems (CRIT services, DOWN hosts) aged
# between these bounds get an inverted red badge and sort above their peers —
# old enough not to be a transient flap, young enough to still be actionable.
# Go duration strings. Defaults:
# hot_min = "15m"
# hot_max = "4h"

# :browser opens the selected host/service in the CheckMK web GUI. {url}
# is replaced by the shell-quoted link; no quotes needed around it.
# Default: "open {url}" on macOS, "xdg-open {url}" elsewhere.
# browser_cmd = "firefox -new-tab {url}"

# :ssh opens a shell on the selected host. {host} is the CheckMK host
# name, shell-quoted. Inside zellij, tmux, WezTerm, kitty (with remote
# control on) or Ghostty 1.3+ on macOS it opens in a new pane; elsewhere
# tuichk steps aside and runs it in place until it exits. ssh_inline = true
# forces the in-place behaviour everywhere.
# ssh_cmd = "ssh -l admin {host}"
# ssh_inline = false

# :wiki opens the selected host in your wiki. {host} is the full CheckMK
# host name, {short} its first DNS label (web01 for web01.example.com),
# both URL-escaped. Opened with browser_cmd like :browser.
# wiki_url = "https://wiki.example.com/{short}"
